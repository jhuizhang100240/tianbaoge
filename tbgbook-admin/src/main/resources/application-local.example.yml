# ============================================================================
# 本机私有配置模板 —— 复制为 application-local.yml 后填值
# ----------------------------------------------------------------------------
#   cp application-local.example.yml application-local.yml
#
# ⚠️ application-local.yml 已在 .gitignore 中，**不要提交**
# ⚠️ 已在 git 历史中的旧凭据仍需轮换（见 plan/待确认项.md G3）
#
# 由各 profile 的 `spring.config.import: optional:classpath:application-local.yml` 加载，
# 因此本文件的值会**覆盖** profile 文件里的同名项。
# 生产环境不使用本文件 —— 凭据一律走环境变量（见 application-prod.yml）
# ============================================================================

spring:
  # 数据库口令（向店主/运维索取，不要写进仓库）
  datasource:
    druid:
      master:
        password: <数据库口令>

      # Druid 控制台账号（本地开发用，生产环境该控制台已关闭）
      statViewServlet:
        login-username: ruoyi
        login-password: <控制台口令>

  # Redis 口令
  data:
    redis:
      password: <Redis口令>

  # 阿里云百炼 API Key（阶段七启用；从百炼控制台创建，勿提交真实值）
  ai:
    dashscope:
      api-key: <百炼 API Key>

# 阿里云 OSS 凭据
aliyun:
  oss:
    accessKeyId: <OSS AccessKeyId>
    accessKeySecret: <OSS AccessKeySecret>

# 微信小程序（阶段九联调）
wechat:
  appId: <小程序 AppId>
  appSecret: <小程序 AppSecret>
